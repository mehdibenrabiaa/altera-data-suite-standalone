<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Altera Data Suite</title>
    <style>
      /* Same self-hosted family as the main app (App.css) -- only the
         weights this page actually uses (400/600) are pulled in. */
      @font-face {
        font-family: "Google Sans Flex";
        font-style: normal;
        font-weight: 400;
        src: url("fonts/GoogleSansFlex-latin.woff2") format("woff2");
      }
      @font-face {
        font-family: "Google Sans Flex";
        font-style: normal;
        font-weight: 600;
        src: url("fonts/GoogleSansFlex-latin-600.woff2") format("woff2");
      }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #FE4D41;
        font-family: "Google Sans Flex", sans-serif;
        user-select: none;
        cursor: default;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        /* Lets the frameless window still be dragged by its own chrome
           instead of being stuck wherever it first opens. */
        -webkit-app-region: drag;
      }

      .splash-logo {
        height: 64px;
        width: auto;
      }

      .splash-name {
        font-size: 22px;
        font-weight: 600;
        color: #ffffff;
        line-height: 1.1;
        text-align: center;
      }

      .splash-tagline {
        margin-top: -10px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.85);
        text-align: center;
      }

      .splash-status {
        margin-top: 14px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.75);
      }

      /* Indeterminate loading bar -- same track/fill language as the app's
         own conversion-progress toast (App.css's .conversion-toast-*),
         just inverted to a white fill since the surrounding chrome here is
         already the accent color instead of neutral. */
      .splash-progress-track {
        width: 160px;
        height: 3px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.25);
      }
      .splash-progress-fill {
        width: 40%;
        height: 100%;
        background: #ffffff;
        animation: splash-progress-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-progress-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(260%); }
      }

      /* Top-right close button -- same corner/hover language as Excel's
         (and every other Office app's) own splash screen: invisible until
         you look for it, solid red fill on hover instead of a whole
         titlebar. Frameless BrowserWindow means there's no native window
         chrome to quit from otherwise. */
      .splash-close-btn {
        position: fixed;
        top: 0;
        right: 0;
        width: 32px;
        height: 28px;
        border: none;
        background: transparent;
        color: rgba(255, 255, 255, 0.8);
        font-family: "Google Sans Flex", sans-serif;
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-app-region: no-drag;
      }
      .splash-close-btn:hover {
        background: rgba(0, 0, 0, 0.25);
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <button class="splash-close-btn" onclick="window.alteraStudio.quitApp()" title="Close" aria-label="Close">✕</button>
    <img class="splash-logo" src="altera-logo-splash.svg" alt="" />
    <div class="splash-name">Altera Data Suite</div>
    <div class="splash-tagline">Turning Unstructured Data into Intelligent Action.</div>
    <div class="splash-progress-track"><div class="splash-progress-fill"></div></div>
    <div class="splash-status">Loading…</div>
  </body>
</html>
